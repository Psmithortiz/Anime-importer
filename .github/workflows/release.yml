name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check that the tag matches the project version
        run: |
          $version = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match project.version $version in pyproject.toml"
            exit 1
          }
      - name: Install dependencies
        run: uv sync --locked --group build
      # A tag can point at any commit, so the checks run again here.
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest
      - name: Build the executable
        run: uv run pyinstaller packaging/anime-importer.spec --noconfirm
      # Checks the bundle itself (static files, demo_data, uvicorn imports, the demo launcher),
      # which the test job does not cover because it runs from the source tree. DEMO is not set
      # here: the normal mode must be the default and the .bat must set the demo mode itself.
      - name: Smoke test the frozen executable
        run: |
          function Test-Launch([string]$Path, [bool]$ExpectedDemo, [string]$Mode) {
            Start-Process -FilePath $Path | Out-Null
            $ok = $false
            try {
              $deadline = (Get-Date).AddSeconds(60)
              while ((Get-Date) -lt $deadline) {
                try {
                  $root = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing
                  $info = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/info"
                  # /api/sessions proves the sessions database could be created.
                  $sessions = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/sessions" -UseBasicParsing
                  if ($root.StatusCode -eq 200 -and $sessions.StatusCode -eq 200 -and $info.app -eq "anime-importer" -and $info.demo -eq $ExpectedDemo) {
                    $ok = $true
                    break
                  }
                } catch {
                  # Not up yet.
                }
                Start-Sleep -Seconds 1
              }
            } finally {
              # With the .bat, Start-Process returns cmd.exe, not the .exe: stop by name.
              Stop-Process -Name AnimeImporter -Force -ErrorAction SilentlyContinue
              # The next case must find port 8000 free, or it would start on another port.
              $freed = (Get-Date).AddSeconds(30)
              while ((Get-Date) -lt $freed -and (Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue)) {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ok) {
              Write-Error "The packaged app did not answer correctly in $Mode mode within 60 seconds"
              exit 1
            }
            Write-Host "Smoke test passed in $Mode mode"
          }
          Test-Launch "dist/AnimeImporter/AnimeImporter.exe" $false "normal"
          Test-Launch "dist/AnimeImporter/AnimeImporter Demo.bat" $true "demo"
      - name: Package
        run: |
          $zip = "AnimeImporter-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "dist/AnimeImporter" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -Encoding ascii
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP "$env:ZIP.sha256" --draft --title "Anime Importer $env:GITHUB_REF_NAME" --generate-notes
  docker:
    name: docker
    # The windows job checks that the tag matches project.version and runs lint and tests:
    # nothing is published if it fails.
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t anime-importer .
      - name: Smoke test in demo mode
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO=1 anime-importer
          for _ in $(seq 1 30); do
            # /api/sessions proves the database could be created by the non-root user.
            if curl -fsS http://127.0.0.1:8000/api/info \
              && curl -fsS http://127.0.0.1:8000/api/sessions; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: Push to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Image names must be lowercase; the owner is "Psmithortiz".
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag anime-importer "$image:$version"
          docker tag anime-importer "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
