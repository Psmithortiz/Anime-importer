services:
  web:
    build: .
    image: anime-importer
    ports:
      # Published on 127.0.0.1 only: the app has no authentication.
      - "127.0.0.1:8000:8000"
    environment:
      # Normal mode by default: the app asks for the API keys in its Settings screen (they are
      # saved in the data volume). For the demo run `DEMO=1 docker compose up`.
      DEMO: ${DEMO:-0}
    volumes:
      # Keeps the normalization and details caches between restarts.
      - cache:/home/app/.cache
      # User data (sessions and the config file with your API keys). Unlike the cache volume,
      # do not delete it to free space.
      - data:/home/app/data

volumes:
  cache:
  data:
