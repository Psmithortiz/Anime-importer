services:
  web:
    build: .
    image: anime-importer
    ports:
      # Published on 127.0.0.1 only: the app has no authentication.
      - "127.0.0.1:8000:8000"
    environment:
      # Demo mode by default. For the real mode use DEMO=0 and a .env file in the project root.
      DEMO: ${DEMO:-1}
    env_file:
      - path: .env
        required: false
    volumes:
      # Keeps the normalization and details caches between restarts.
      - cache:/home/app/.cache

volumes:
  cache:
